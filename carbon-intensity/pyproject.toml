[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carbon-intensity"
version = "0.1.0"
description = "Hourly US carbon intensity → Flambe observation"
requires-python = ">=3.11"
dependencies = [
  "dagster>=1.9.0",
  "dagster-webserver>=1.9.0",
  "gridstatus>=0.36.0,<0.37",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.dagster]
module_name = "carbon_intensity.definitions"
code_location_name = "carbon_intensity"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
